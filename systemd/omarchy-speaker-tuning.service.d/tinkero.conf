[Unit]
# Tinkero: stop with the Tinkero session, so nothing of it runs under a later GNOME login.
PartOf=graphical-session.target
# omarchy-audio-tuning writes this file only on the laptops a tuning matches; the unit's own
# file always ships, so without this the condition fails quietly on every other machine instead
# of crash-looping (issue #34).
ConditionPathExists=%E/pipewire/omarchy-speaker-tuning.conf
