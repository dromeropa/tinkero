name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Floats on purpose: CI should notice when Fedora's ShellCheck, rpmlint or rpm change.
    container: fedora:44
    steps:
      - name: Tools
        run: dnf -y install git-core curl diffutils findutils ShellCheck rpmlint rpm-build rpmdevtools make nodejs
      - uses: actions/checkout@v4
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: ShellCheck
        run: >
          shellcheck -x -e SC1090,SC1091
          dev build/assemble build/fetch-upstream build/render-spec build/lib.sh
          ci/gate-arch-leak ci/gate-dropped-refs ci/gate-single-copy ci/gate-name-map ci/lib-gate.sh
          tests/run tests/lib.sh tests/test-*.sh tests/fixtures/make-tree.sh
          distro/fedora/replacements/* distro/fedora/lib/pkg.sh
          distro/fedora/specs/srpm.sh bin/tinkero-copr
      - name: Unit tests
        run: ./dev check
      - name: Gates on the real upstream tree
        run: ./dev gates
      - name: Spec renders, parses and lints
        run: |
          ./dev spec
          rpmspec -P tinkero.spec > /dev/null
          rpmlint tinkero.spec
      - name: Package specs parse and lint
        run: |
          for s in distro/fedora/specs/*.spec; do rpmspec -P "$s" > /dev/null || exit 1; done
          rpmlint distro/fedora/specs/*.spec
      - name: One package SRPM builds the way COPR builds it (glaze, the smallest)
        run: |
          mkdir -p "$PWD/.cache/srpm-glaze"
          make -f .copr/Makefile srpm spec=distro/fedora/specs/glaze.spec outdir="$PWD/.cache/srpm-glaze"
          ls -l .cache/srpm-glaze/*.src.rpm
      - name: A vendored (Rust) package SRPM builds the way COPR builds it (ttfx)
        run: |
          mkdir -p "$PWD/.cache/srpm-ttfx"
          make -f .copr/Makefile srpm spec=distro/fedora/specs/ttfx.spec outdir="$PWD/.cache/srpm-ttfx"
          ls -l .cache/srpm-ttfx/*.src.rpm
      - name: SRPM builds the way COPR builds it
        run: |
          mkdir -p "$PWD/.cache/srpm"
          make -f .copr/Makefile srpm outdir="$PWD/.cache/srpm"
          ls -l .cache/srpm/*.src.rpm
