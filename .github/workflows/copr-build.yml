name: copr-build
# Register and build packages of the Tinkero package set on COPR, in dependency
# order, one at a time. Manual only: builds cost COPR time and publish to the repo.
on:
  # GitHub only lists a workflow for `gh workflow run` once some event has run it
  # on a branch; until this file is on master, a push that touches it registers it.
  # The job below is skipped on push, so nothing is built.
  push:
    paths:
      - .github/workflows/copr-build.yml
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names from distro/fedora/specs/build-order.txt, or 'all'"
        required: true
        default: all
      command:
        description: "register, build or all"
        required: true
        default: all
permissions:
  contents: read
concurrency:
  group: copr-build
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  copr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 360
    steps:
      - name: Tools
        run: dnf -y install git-core copr-cli
      - uses: actions/checkout@v4
      - name: COPR token
        run: |
          mkdir -p ~/.config && install -m 0600 /dev/null ~/.config/copr
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          # whoami reads the config; the token is first checked by the API in the Submit step, which stops at the first failure
          copr-cli whoami
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
      - name: Submit
        # the inputs reach the shell through the environment, never spliced into the script
        env:
          PACKAGES: ${{ inputs.packages }}
          COMMAND: ${{ inputs.command }}
          TINKERO_COPR_COMMIT: ${{ github.ref_name }}
        run: |
          pkgs=""; [[ $PACKAGES != all ]] && pkgs=$PACKAGES
          # shellcheck disable=SC2086  # pkgs is a space-separated list by design
          bin/tinkero-copr "$COMMAND" $pkgs
